default: &default
  adapter: postgresql
  encoding: utf8
  pool: 5
  username: <%= ENV.fetch('DB_USERNAME') { Rails.application.credentials.dig(:db, :username) } %>
  password: <%= ENV.fetch('DB_PASSWORD') { Rails.application.credentials.dig(:db, :password) } %>
  host: <%= ENV.fetch('DB_HOST') { Rails.application.credentials.dig(:db, :host) } %>
  port: <%= ENV.fetch('DB_PORT', 5432) %>

development:
  primary:
    <<: *default
    database: sgtcc_production

  queue:
    adapter: sqlite3
    database: storage/queue_development.sqlite3
    migrations_paths: db/queue_migrate
    pool: 5
    timeout: 15000
    properties:
      journal_mode: WAL

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: sgtcc_test

  queue:
    adapter: sqlite3
    database: storage/queue_test.sqlite3
    migrations_paths: db/queue_migrate
    pool: 5
    timeout: 15000
    properties:
      journal_mode: WAL

production:
  primary:
    <<: *default
    database: sgtcc_production

  queue:
    adapter: sqlite3
    database: storage/queue_production.sqlite3
    migrations_paths: db/queue_migrate
    pool: 5
    timeout: 15000
    properties:
      journal_mode: WAL
